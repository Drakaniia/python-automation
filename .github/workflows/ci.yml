  installer-smoke-unix:
    name: Installer smoke (Linux)
    runs-on: ubuntu-latest
    needs: fmt

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Stage local release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/package smoke/assets smoke/install-bin
          cp target/release/magic target/release/portkill smoke/package/
          tar -czf smoke/assets/magic-linux-x64.tar.gz -C smoke/package .
          cd smoke/assets
          sha256sum magic-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Install, verify, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          MAGIC_BASE_URL="$PWD/smoke/assets" MAGIC_INSTALL_DIR="$PWD/smoke/install-bin" sh scripts/install.sh
          "$PWD/smoke/install-bin/magic" --version
          "$PWD/smoke/install-bin/portkill" --version
          MAGIC_INSTALL_DIR="$PWD/smoke/install-bin" sh scripts/uninstall.sh
          test ! -e "$PWD/smoke/install-bin/magic"
          test ! -e "$PWD/smoke/install-bin/portkill"

  installer-smoke-windows:
    name: Installer smoke (Windows)
    runs-on: windows-latest
    needs: fmt

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Stage local release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path smoke/package, smoke/assets, smoke/install-bin -Force | Out-Null
          Copy-Item target/release/magic.exe smoke/package/
          Copy-Item target/release/portkill.exe smoke/package/
          Compress-Archive -Path smoke/package/* -DestinationPath smoke/assets/magic-windows-x64.zip -Force
          $hash = (Get-FileHash -Path smoke/assets/magic-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  magic-windows-x64.zip" | Set-Content smoke/assets/SHA256SUMS.txt

      - name: Install, verify, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $PWD "smoke/install-bin"
          ./scripts/install.ps1 -BaseUrl (Join-Path $PWD "smoke/assets") -InstallDir $installDir
          & (Join-Path $installDir "magic.exe") --version
          & (Join-Path $installDir "portkill.exe") --version
          ./scripts/uninstall.ps1 -InstallDir $installDir
          if (Test-Path (Join-Path $installDir "magic.exe")) { throw "magic.exe was not removed" }
          if (Test-Path (Join-Path $installDir "portkill.exe")) { throw "portkill.exe was not removed" }
